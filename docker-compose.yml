services:
  # 1. Our fastapi app service
  web_app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: fastapi_quiz_app
    # We mount the local 'app' folder into the container so the code changes on the host machine take effect immediatley ("hot" reloading)
    volumes:
      - ./app:/code/app
    ports:
      - "8000:8000"
    environment:
      # PLEASE NOTE: instead of 'localhost' we use the docker compose service names as host!
      - DATABASE_URL=postgresql+asyncpg://my_user:my_password@postgres_db:5432/my_database
      - REDIS_URL=redis://redis_cache:6379/0
      - PYTHONPATH=/code/app
    depends_on:
      postgres_db:
        condition: service_healthy # The application will wait until Postgres is fully up and ready to accept connections
      redis_cache:
        condition: service_started

    # Automatic rebuild when dependencies change
    develop:
      watch:
        - action: rebuild
          path: ./requirements.txt

  # 2. POSTGRESQL service
  postgres_db:
    image: postgres:16-alpine
    container_name: local-postgres
    environment:
      POSTGRES_DB: my_database
      POSTGRES_USER: my_user
      POSTGRES_PASSWORD: my_password
    ports:
      - "5432:5432"
    volumes:
      - pg_quiz_data:/var/lib/postgresql/data
      # Health check - Docker Compose finds out when the database is truly ready
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U my_user -d my_database"]
      interval: 5s
      timeout: 5s
      retries: 5

  # 3. REDIS service
  redis_cache:
    image: redis:7-alpine
    container_name: local_redis
    ports:
      - "6379:6379"
    volumes:
      - redis_quiz_data:/data

# Persistent volumes for storing database data on your computer
volumes:
  pg_quiz_data:
  redis_quiz_data:

 # Naming our network
networks:
  default:
    name: quiz_network






